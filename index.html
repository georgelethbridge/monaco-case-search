<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monaco Case Processor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <h1>Monaco Case Processor</h1>

    <div class="card">
      <h2>Patent Numbers</h2>
      <p class="help-text">
        Upload a spreadsheet or paste patent numbers. Accepted separators:
        tab, space, line break, comma, ampersand, or semicolon.
      </p>

      <label class="field-label" for="fileInput">Upload spreadsheet</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" />

      <div class="or-divider"><span>or</span></div>

      <label class="field-label" for="patentList">Paste patent numbers</label>
      <textarea
        id="patentList"
        rows="8"
        placeholder="Example:
EP3363809, EP1234567
EP7654321; EP9999999"
      ></textarea>

      <div class="button-row">
        <button id="processPoasBtn">Process PoAs</button>
        <button id="generateFormsBtn">Generate Forms</button>
      </div>

      <div id="error" class="error hidden"></div>
    </div>

    <div class="card hidden" id="progressCard">
      <h2 id="progressTitle">Processing</h2>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p id="progressText">Waiting...</p>
    </div>

    <div class="card hidden" id="resultsCard">
      <h2>Downloads</h2>
      <p id="resultsMessage"></p>
      <button id="downloadPoasBtn" class="hidden">Download PoAs</button>
      <button id="downloadFilingBtn" class="hidden">Download Forms</button>
    </div>

    <div class="card hidden" id="reviewCard">
      <h2>Owner details (Titulaire)</h2>
      <div class="tableWrap">
        <table id="resultsTable">
          <thead>
            <tr>
              <th>EP</th>
              <th>Applicant name</th>
              <th>Applicant address</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
